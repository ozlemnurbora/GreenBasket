name: green_basket
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase paketleri
  firebase_core: 2.27.0
  firebase_auth: 4.17.8
  cloud_firestore: 4.15.8
  firebase_storage: 11.6.9

  # YENİ: Tarihleri formatlamak için ekledik
  intl: ^0.19.0

  # Üreticinin galeriden ürün fotoğrafı seçebilmesi için
  image_picker: ^1.0.7

  # ImgBB
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Resimler
  assets:
    - assets/images/